name: Validate Windows sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and compile native helpers
        shell: powershell
        run: .\Test-Source.ps1
      - name: Verify media calculations
        shell: powershell
        run: .\Test-Media.ps1
